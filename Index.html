<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurum · Ask and create with Gemini</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --navy-900: #060e24;
    --navy-800: #0a1530;
    --navy-700: #101f45;
    --navy-600: #192d5e;
    --line: #26407e;
    --gold: #d9b24c;
    --gold-soft: #f0d98f;
    --red: #e5484d;
    --ink: #eef1f8;
    --muted: #93a2c8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    background: radial-gradient(1200px 600px at 50% -200px, #14275a 0%, var(--navy-800) 55%, var(--navy-900) 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.55;
  }
  .app { height: 100dvh; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
  .logo { width: 34px; height: 34px; flex: none; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; letter-spacing: .04em; color: var(--gold-soft); }
  .brand small { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: .72rem; letter-spacing: 0; color: var(--muted); margin-top: -3px; }
  .spacer { flex: 1; }
  .icon-btn {
    background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font: inherit; font-size: .9rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold-soft); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: none; }
  .nokey .dot { display: inline-block; }

  /* Mode tabs */
  .tabs { display: flex; gap: 6px; padding: 0 20px 12px; }
  .tab {
    background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--gold-soft); border-bottom-color: var(--red); }

  /* Feed */
  #feed { flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; max-width: 480px; color: var(--muted); }
  .empty h2 { font-family: Georgia, serif; font-weight: 400; color: var(--ink); font-size: 1.6rem; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    background: var(--navy-700); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: .88rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--gold); }

  .msg { max-width: 92%; padding: 12px 16px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--navy-600); border: 1px solid var(--line); border-right: 3px solid var(--red); }
  .msg.model { align-self: flex-start; background: var(--navy-700); border: 1px solid var(--line); border-left: 3px solid var(--gold); }
  .msg.error { align-self: flex-start; background: #3a1220; border: 1px solid var(--red); color: #ffd7d9; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .msg h4 { margin: .8em 0 .3em; color: var(--gold-soft); font-size: 1rem; }
  .msg code { background: var(--navy-900); padding: 1px 6px; border-radius: 5px; font-family: Consolas, monospace; font-size: .9em; }
  .msg pre { background: var(--navy-900); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .msg pre code { padding: 0; background: none; }
  .katex { font-size: 1.1em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; margin: .6em 0; }
  .final .katex { font-size: 1.15em; }
  .final {
    margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 1.1rem; font-weight: 600;
    background: rgba(217,178,76,.12); border: 1px solid var(--gold);
  }
  .final span { display: block; font-size: .75rem; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
  .att { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .att img, .gen img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
  .att img { width: 110px; height: 110px; object-fit: cover; }
  .gen img { display: block; max-height: 460px; }
  .gen a {
    display: inline-block; margin-top: 8px; color: var(--navy-900); background: var(--gold); text-decoration: none;
    padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem;
  }
  .typing span { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--gold); animation: bob 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }

  /* Composer */
  .composer { padding: 12px 20px 18px; border-top: 1px solid var(--line); background: rgba(6,14,36,.7); }
  #previews { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  #previews:empty { display: none; }
  .pv { position: relative; width: 64px; height: 64px; }
  .pv img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .pv button {
    position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; padding: 0; line-height: 1;
    border-radius: 50%; border: 0; background: var(--red); color: #fff; cursor: pointer;
  }
  .box { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; min-height: 48px; max-height: 180px; resize: none; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--navy-700); border: 1px solid var(--line); border-radius: 12px;
  }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { outline: none; border-color: var(--gold); }
  .attach {
    width: 48px; height: 48px; flex: none; border-radius: 12px; border: 1px solid var(--line);
    background: var(--navy-700); color: var(--gold-soft); font-size: 1.3rem; cursor: pointer;
  }
  .attach:hover { border-color: var(--gold); }
  .send {
    height: 48px; padding: 0 22px; flex: none; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold)); color: var(--navy-900); font: inherit; font-weight: 700;
  }
  .send:disabled { opacity: .5; cursor: wait; }
  .hint { margin: 8px 2px 0; font-size: .78rem; color: var(--muted); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Settings dialog */
  dialog {
    width: min(480px, 92vw); padding: 0; color: var(--ink); background: var(--navy-800);
    border: 1px solid var(--gold); border-radius: 16px;
  }
  dialog::backdrop { background: rgba(3,8,22,.75); }
  .dlg { padding: 22px; }
  .dlg h2 { font-family: Georgia, serif; font-weight: 400; margin: 0 0 4px; color: var(--gold-soft); }
  .dlg p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .dlg label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
  .dlg input[type=password], .dlg input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--navy-700);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .dlg a { color: var(--gold); }
  .keyrow { display: flex; gap: 8px; }
  .keyrow input { flex: 1; }
  .dlg .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .btn { padding: 10px 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy-900); }
  .btn.red { border-color: var(--red); color: #ffb3b6; }
  .saved { color: var(--gold-soft); font-size: .85rem; margin-right: auto; align-self: center; }

  @media (max-width: 520px) { .send { padding: 0 14px; } .tabs, header, #feed, .composer { padding-left: 14px; padding-right: 14px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 3 L37 20 L20 37 L3 20 Z" fill="#d9b24c"/>
      <path d="M20 9 L31 20 L20 31 L9 20 Z" fill="#0a1530"/>
      <circle cx="20" cy="20" r="4.5" fill="#e5484d"/>
    </svg>
    <div class="brand">Aurum<small>Ask and create with Gemini</small></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clear" title="Start a new chat">New chat</button>
    <button class="icon-btn" id="openSettings"><span class="dot"></span>Settings</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-ask" aria-selected="true">Ask</button>
    <button class="tab" role="tab" id="tab-create" aria-selected="false">Create image</button>
  </div>

  <div id="feed" aria-live="polite"></div>

  <div class="composer">
    <div id="previews"></div>
    <div class="box">
      <button class="attach" id="attach" title="Add pictures (optional)" aria-label="Add pictures">+</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <textarea id="q" rows="1"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <p class="hint" id="hint"></p>
    <label class="hint" id="thinkWrap" style="display:block"><input type="checkbox" id="think"> Think longer (slower, but better for hard math)</label>
  </div>
</div>

<dialog id="settings">
  <div class="dlg">
    <h2>Settings</h2>
    <p>Your key is saved only in this browser and is sent only to Google.</p>
    <label for="key">Gemini API key</label>
    <div class="keyrow">
      <input id="key" type="password" autocomplete="off" placeholder="Paste your key">
      <button class="btn" id="showKey" type="button">Show</button>
    </div>
    <p style="margin:6px 0 0">Get one free at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></p>
    <label for="textModel">Model for answers</label>
    <input id="textModel" type="text">
    <label for="imageModel">Model for image creation</label>
    <input id="imageModel" type="text">
    <div class="row">
      <span class="saved" id="saved"></span>
      <button class="btn red" id="forget" type="button">Remove key</button>
      <button class="btn gold" id="save" type="button">Save</button>
    </div>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const BASE = "https://generativelanguage.googleapis.com/v1beta/models";
const DEFAULTS = { textModel: "gemini-3.8-flash", imageModel: "gemini-3.1-flash-image" };
const RETIRED = ["gemini-2.5-flash", "gemini-2.5-flash-image", "gemini-2.0-flash", "gemini-2.5-pro"];
const SYSTEM = [
  "You are a capable, friendly assistant. Always give a direct, complete answer to what was asked. Never just describe the question or refuse to attempt it.",
  "If there is a math problem (typed or in a picture), solve it fully: show clear steps, double-check the arithmetic, then end with a final line that starts exactly with 'Final answer:' followed by the result.",
  "Write all math in LaTeX: inline math between single dollar signs like $x^2 + 1$, and larger equations between double dollar signs on their own lines like $$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$. Use LaTeX only for math, never for ordinary sentences. Write money in words (for example '5 dollars') so dollar signs are only used for math. Format the last line like: Final answer: $x = 5$",
  "Keep paragraphs short. Use simple lists and **bold** for key terms. When pictures are attached, use them; when none are, just answer the text."
].join("\n");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const pick = (saved, fallback) => (saved && !RETIRED.includes(saved)) ? saved : fallback;
const cfg = () => ({
  key: store.get("aurum_key") || "",
  textModel: pick(store.get("aurum_text"), DEFAULTS.textModel),
  imageModel: pick(store.get("aurum_image"), DEFAULTS.imageModel)
});

let mode = "ask";
let attached = [];      // {name, mime, data, url}
let history = [];       // chat turns for follow-up questions
let busy = false;

/* ---------- Mode ---------- */
const CHIPS = {
  ask: ["Solve: 3x + 7 = 25", "What can you tell me about this photo?", "Explain how rainbows form"],
  create: ["A gold and navy art deco skyline at dusk", "A friendly robot reading a book, flat illustration", "Make this photo look like a watercolor painting"]
};
function setMode(m) {
  mode = m;
  $("tab-ask").setAttribute("aria-selected", m === "ask");
  $("tab-create").setAttribute("aria-selected", m === "create");
  $("q").placeholder = m === "ask" ? "Ask anything, or add a picture and ask about it" : "Describe the image you want, or add a picture to edit it";
  $("hint").textContent = m === "ask"
    ? "Pictures are optional. Enter to send, Shift+Enter for a new line."
    : "Add a picture to edit or restyle it. Image creation may need a billing-enabled key.";
  $("thinkWrap").style.display = m === "ask" ? "block" : "none";
  renderEmpty();
}
$("tab-ask").onclick = () => setMode("ask");
$("tab-create").onclick = () => setMode("create");

/* ---------- Feed ---------- */
function renderEmpty() {
  if ($("feed").querySelector(".msg")) return;
  const f = $("feed");
  f.innerHTML = "";
  const d = document.createElement("div");
  d.className = "empty";
  d.innerHTML = mode === "ask"
    ? "<h2>What would you like to know?</h2><div>Type a question, math problems included. Add a picture only if you want one analyzed.</div>"
    : "<h2>What should we make?</h2><div>Describe an image, or add a picture and say how to change it.</div>";
  const c = document.createElement("div");
  c.className = "chips";
  CHIPS[mode].forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.onclick = () => { $("q").value = t; $("q").focus(); };
    c.append(b);
  });
  d.append(c);
  f.append(d);
}
function addMsg(cls, html) {
  const f = $("feed");
  const e = f.querySelector(".empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (html != null) d.innerHTML = html;
  f.append(d);
  f.scrollTop = f.scrollHeight;
  return d;
}

/* ---------- Pictures ---------- */
function addFiles(files) {
  [...files].filter(f => f.type.startsWith("image/")).forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      attached.push({ name: f.name, mime: f.type, data: r.result.split(",")[1], url: r.result });
      renderPreviews();
    };
    r.readAsDataURL(f);
  });
}
function renderPreviews() {
  const box = $("previews");
  box.innerHTML = "";
  attached.forEach((a, i) => {
    const d = document.createElement("div"); d.className = "pv";
    const im = document.createElement("img"); im.src = a.url; im.alt = a.name;
    const b = document.createElement("button"); b.textContent = "×"; b.setAttribute("aria-label", "Remove " + a.name);
    b.onclick = () => { attached.splice(i, 1); renderPreviews(); };
    d.append(im, b); box.append(d);
  });
}
$("attach").onclick = () => $("file").click();
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
document.addEventListener("paste", e => { if (e.clipboardData.files.length) addFiles(e.clipboardData.files); });
["dragover", "drop"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if (ev === "drop") addFiles(e.dataTransfer.files);
}));

/* ---------- Rendering model text ---------- */
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function md(src) {
  const blocks = [];
  src = src.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  const maths = [];
  src = src.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (m, a, b, c, d) => {
    maths.push({ tex: (a ?? b ?? c ?? d).trim(), display: a !== undefined || b !== undefined });
    return "\u0001" + (maths.length - 1) + "\u0001";
  });
  const renderMath = ({ tex, display }) => {
    if (typeof katex === "undefined") return "<code>" + esc(tex) + "</code>";
    try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
    catch (e) { return "<code>" + esc(tex) + "</code>"; }
  };
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  let html = "", list = null;
  const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (const l of esc(src).split("\n")) {
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    close();
    if (!l.trim()) continue;
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { html += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^\s*\**Final answer:?\**:?\s*(.*)/i))) { html += '<div class="final"><span>Final answer</span>' + inline(m[1]) + "</div>"; continue; }
    html += "<p>" + inline(l) + "</p>";
  }
  close();
  return html
    .replace(/\u0001(\d+)\u0001/g, (_, i) => renderMath(maths[i]))
    .replace(/\u0000(\d+)\u0000/g, (_, i) => "<pre><code>" + esc(blocks[i]) + "</code></pre>");
}

/* ---------- Gemini ---------- */
async function callGemini(model, body, key) {
  let res;
  try {
    res = await fetch(BASE + "/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  } catch (e) {
    throw new Error("Couldn't reach Google. Open this file directly in Chrome, Edge, Firefox or Safari (not inside a preview window), check your internet connection, and turn off any ad blocker or VPN for this page.");
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error?.message || res.statusText);
  const parts = json.candidates?.[0]?.content?.parts || [];
  if (!parts.length) {
    const why = json.promptFeedback?.blockReason || json.candidates?.[0]?.finishReason;
    throw new Error("Gemini sent back no answer" + (why ? " (" + why + ")" : "") + ". Try rewording the request.");
  }
  return parts;
}
async function streamGemini(model, body, key, onText) {
  let res;
  try {
    res = await fetch(BASE + "/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse&key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
  } catch (e) {
    throw new Error("Couldn't reach Google. Open this file directly in Chrome, Edge, Firefox or Safari (not inside a preview window), check your internet connection, and turn off any ad blocker or VPN for this page.");
  }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error?.message || res.statusText);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", full = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      try {
        const parts = JSON.parse(line.slice(5)).candidates?.[0]?.content?.parts || [];
        const t = parts.filter(p => !p.thought).map(p => p.text || "").join("");
        if (t) { full += t; onText(full); }
      } catch (e) {}
    }
  }
  if (!full.trim()) throw new Error("Gemini sent back no answer. Try rewording the request.");
  return full;
}
const imgPart = a => ({ inlineData: { mimeType: a.mime, data: a.data } });

async function send() {
  if (busy) return;
  const { key, textModel, imageModel } = cfg();
  let text = $("q").value.trim();
  const typed = text;
  if (!key) { openSettings(); return; }
  if (mode === "create" && !text) { $("q").focus(); return; }
  if (!text && !attached.length) { $("q").focus(); return; }
  if (!text) text = "Answer whatever is asked or shown in this picture. If it contains a problem, solve it completely.";

  const sent = attached.slice();
  attached = []; renderPreviews();
  $("q").value = ""; autosize();

  const u = addMsg("user", "");
  if (sent.length) {
    const a = document.createElement("div"); a.className = "att";
    sent.forEach(s => { const im = document.createElement("img"); im.src = s.url; im.alt = s.name; a.append(im); });
    u.append(a);
  }
  const p = document.createElement("div"); p.textContent = typed || "Solve or answer what's in this picture"; u.append(p);

  const wait = addMsg("model", '<div class="typing"><span></span><span></span><span></span></div>');
  busy = true; $("send").disabled = true;

  try {
    if (mode === "ask") {
      history.push({ role: "user", parts: [...sent.map(imgPart), { text }] });
      const body = {
        systemInstruction: { parts: [{ text: SYSTEM }] },
        contents: history
      };
      if (!$("think").checked) body.generationConfig = { thinkingConfig: { thinkingLevel: "low" } };
      const show = t => { wait.innerHTML = md(t); $("feed").scrollTop = $("feed").scrollHeight; };
      let answer;
      try {
        try {
          answer = await streamGemini(textModel, body, key, show);
        } catch (e) {
          if (body.generationConfig && /thinking/i.test(e.message)) {
            delete body.generationConfig;
            answer = await streamGemini(textModel, body, key, show);
          } else throw e;
        }
      } catch (e) { history.pop(); throw e; }
      history.push({ role: "model", parts: [{ text: answer.trim() }] });
    } else {
      const parts = await callGemini(imageModel, {
        contents: [{ role: "user", parts: [...sent.map(imgPart), { text }] }],
        generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
      }, key);
      wait.innerHTML = ""; wait.classList.add("gen");
      let made = 0;
      for (const part of parts) {
        const d = part.inlineData || part.inline_data;
        if (d) {
          made++;
          const url = "data:" + (d.mimeType || d.mime_type || "image/png") + ";base64," + d.data;
          const im = document.createElement("img"); im.src = url; im.alt = "Generated image";
          const dl = document.createElement("a"); dl.href = url; dl.download = "aurum-image-" + Date.now() + ".png"; dl.textContent = "Download";
          wait.append(im, dl);
        } else if (part.text) {
          const t = document.createElement("div"); t.innerHTML = md(part.text); wait.append(t);
        }
      }
      if (!made) { wait.className = "msg error"; wait.textContent = "No image came back. Try a more specific description."; }
    }
  } catch (err) {
    wait.className = "msg error";
    let m = err.message || String(err);
    if (/API key/i.test(m)) m += " Open Settings to check your key.";
    if (mode === "create" && /quota|billing|limit/i.test(m)) m += " Image creation can require a billing-enabled Google AI Studio project.";
    wait.textContent = m;
  } finally {
    busy = false; $("send").disabled = false;
    $("feed").scrollTop = $("feed").scrollHeight;
  }
}
$("send").onclick = send;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
function autosize() { const q = $("q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; }
$("q").addEventListener("input", autosize);

$("clear").onclick = () => { history = []; $("feed").innerHTML = ""; renderEmpty(); };

/* ---------- Settings ---------- */
const dlg = $("settings");
function updateKeyState() { $("app").classList.toggle("nokey", !cfg().key); }
function openSettings() {
  const c = cfg();
  $("key").value = c.key; $("key").type = "password"; $("showKey").textContent = "Show";
  $("textModel").value = c.textModel; $("imageModel").value = c.imageModel;
  $("saved").textContent = "";
  dlg.showModal();
}
$("openSettings").onclick = openSettings;
$("showKey").onclick = () => {
  const hidden = $("key").type === "password";
  $("key").type = hidden ? "text" : "password";
  $("showKey").textContent = hidden ? "Hide" : "Show";
};
$("save").onclick = () => {
  const k = $("key").value.trim();
  if (k) store.set("aurum_key", k); else store.del("aurum_key");
  store.set("aurum_text", $("textModel").value.trim() || DEFAULTS.textModel);
  store.set("aurum_image", $("imageModel").value.trim() || DEFAULTS.imageModel);
  updateKeyState();
  dlg.close();
};
$("forget").onclick = () => { store.del("aurum_key"); $("key").value = ""; updateKeyState(); $("saved").textContent = "Key removed"; };
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

updateKeyState();
setMode("ask");
if (!cfg().key) setTimeout(openSettings, 300);
</script>
</body>
</html>
